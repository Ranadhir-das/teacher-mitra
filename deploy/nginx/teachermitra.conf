# Include in Nginx's http context (e.g. sites-enabled on Debian/Ubuntu).
# Replace bootstrap config with this ONLY AFTER certificates exist.
limit_req_zone $binary_remote_addr zone=teachermitra_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=teachermitra_api:10m rate=10r/s;
log_format teachermitra_safe escape=json
    '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
    '"duration":$request_time,"bytes":$body_bytes_sent}';
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name teachermitra.com www.teachermitra.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://teachermitra.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name teachermitra.com www.teachermitra.com;
    ssl_certificate /etc/letsencrypt/live/teachermitra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teachermitra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Reject unexpected SNI/Host combinations, including raw public-IP requests.
    if ($host !~ ^(teachermitra\.com|www\.teachermitra\.com)$) { return 444; }
    client_max_body_size 12m;
    client_body_timeout 30s;
    limit_req_status 429;
    access_log /var/log/nginx/teachermitra-access.log teachermitra_safe;
    # Nginx error logs can contain URLs: keep restrictive permissions/retention.
    error_log /var/log/nginx/teachermitra-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=3600" always;

    location ^~ /static/ {
        alias /var/lib/teachermitra/static/;
        autoindex off;
        expires 1h;
    }
    # Only non-sensitive profile images are public. No general /media alias.
    location ^~ /media/profiles/ {
        alias /var/lib/teachermitra/media/profiles/;
        autoindex off;
        types { image/jpeg jpg jpeg; image/png png; image/gif gif; image/webp webp; }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=3600" always;
    }
    location /media/ { return 404; }
    location /private_documents/ { return 404; }
    location ~ /\. { deny all; }

    location ~ ^/(accounts/login/|admin/login/|partner/signup/|api/v1/auth/(login|refresh)/|api/v1/partners/signup/)$ {
        limit_req zone=teachermitra_login burst=5 nodelay;
        include /etc/nginx/snippets/teachermitra-proxy.conf;
    }
    location /api/ {
        limit_req zone=teachermitra_api burst=20 nodelay;
        include /etc/nginx/snippets/teachermitra-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/teachermitra-proxy.conf;
    }
}
