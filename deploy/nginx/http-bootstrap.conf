# Install ONLY during certificate provisioning. Do not proxy logins over HTTP.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name teachermitra.com www.teachermitra.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 503; }
}
