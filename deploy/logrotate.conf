# Use instead of the distro's overlapping /var/log/nginx/*.log rule, not both.
/var/log/nginx/teachermitra-*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
