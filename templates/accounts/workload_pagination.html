{% if page.paginator.num_pages > 1 %}
<nav aria-label="{{ label }} pages" class="pagination-bar">
    {% if page.has_previous %}
        <a class="btn btn-sm btn-outline-secondary" href="?{{ parameter }}={{ page.previous_page_number }}">Previous</a>
    {% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
        <a class="btn btn-sm btn-outline-secondary" href="?{{ parameter }}={{ page.next_page_number }}">Next</a>
    {% endif %}
</nav>
{% endif %}
